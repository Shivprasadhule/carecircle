[project]
name = "carecircle"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "boto3>=1.43.116",
    "fastapi>=0.156.4",
    "mcp>=1.23,<2",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
    "strands-agents>=1.61.1",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/carecircle"]

[project.scripts]
carecircle = "carecircle.app:main"


[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "pytest-asyncio>=0.23",
    "pillow>=13.0.0",
]
